# Javascript Node CircleCI 2.0 configuration file
#
# Check https://circleci.com/docs/2.0/language-javascript/ for more details
#
version: 2
jobs:
  build:
    docker:
      # specify the version you desire here
      - image: cimg/node:26.12

    working_directory: ~/repo

    steps:
      - checkout

      # Download and cache dependencies
      - restore_cache:
          keys:
          - v2-dependencies-{{ checksum "aws/package-lock.json" }}
      - run:
          command: npm ci
          working_directory: aws


      - save_cache:
          paths:
            - aws/node_modules
          key: v2-dependencies-{{ checksum "aws/package-lock.json" }}
        
      # run tests!
      # - run: npm test

      # run npm run build
      - run:
          command: npm run build
          working_directory: aws

  deploy:
    docker:
      # specify the version you desire here
      - image: cimg/node:26.12

    working_directory: ~/repo

    steps:
      - checkout


      # build jobの箇所 workflowsのrequiresでbuildを指定しているのでbuildしてくれてると思ったけど、してくれてなさそうなので仕方なくここでビルドする。
      # Download and cache dependencies
      - restore_cache:
          keys:
          - v2-dependencies-{{ checksum "aws/package-lock.json" }}
      - run:
          command: npm ci
          working_directory: aws
      - save_cache:
          paths:
            - aws/node_modules
          key: v2-dependencies-{{ checksum "aws/package-lock.json" }}        
      - run:
          command: npm run build
          working_directory: aws
      
      
      # install awscli
      - run:
          name: Install dependencies
          command: |
            curl -sSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
            unzip -q /tmp/awscliv2.zip -d /tmp
            sudo /tmp/aws/install
      - run:
          command: |
            aws s3 sync aws/public/ s3://craftbeer-loves.com --acl public-read

workflows:
  version: 2
  build_and_test_and_deploy:
    jobs:
      - build
      # - test:
      #     requires:
      #       - build
      #     # filters:
      #     #   branches:
      #     #     only: master
      - deploy:
          requires:
            - build
            # - test
          filters:
            branches:
              only: 
                - master
